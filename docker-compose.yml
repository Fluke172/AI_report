version: "3.8"

services:
  weekly-report-api:
    build:
      context: .
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-docker.1ms.run/library/python:3.11-slim}
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./app:/app/app    # 挂载代码目录，改 prompt 后 restart 即生效，无需 rebuild
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
